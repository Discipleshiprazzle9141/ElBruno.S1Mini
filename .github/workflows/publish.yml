name: Publish to NuGet

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Package version (leave empty to use csproj version)"
        required: false
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Determine version
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "release" ]]; then
            VERSION="${{ github.event.release.tag_name }}"
            VERSION="${VERSION#v}"
            VERSION="${VERSION#.}"
          elif [[ -n "${{ inputs.version }}" ]]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION=$(dotnet msbuild src/ElBruno.S1Mini/ElBruno.S1Mini.csproj -nologo -getProperty:Version | tr -d '\r')
          fi
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "❌ Invalid version: '$VERSION'"; exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "📦 Publishing version: $VERSION"

      - name: Restore
        run: dotnet restore ElBruno.S1Mini.slnx

      - name: Build
        run: dotnet build src/ElBruno.S1Mini/ElBruno.S1Mini.csproj -c Release --no-restore -p:Version=${{ steps.version.outputs.version }}

      - name: Unit Tests
        run: dotnet test src/tests/ElBruno.S1Mini.Tests/ElBruno.S1Mini.Tests.csproj -c Release --framework net8.0 -p:Version=${{ steps.version.outputs.version }} --verbosity normal

      - name: Validate README What's New policy
        run: |
          SECTION=$(awk '/^## What'"'"'s New/{flag=1;next}/^## /{flag=0}flag{print}' README.md)
          if [[ -z "$SECTION" ]]; then
            echo "❌ README.md must contain a '## What's New' section."
            exit 1
          fi

          COUNT=$(printf "%s\n" "$SECTION" | grep -E '^- ' | wc -l | xargs)
          if [[ "$COUNT" -ne 5 ]]; then
            echo "❌ '## What's New' must contain exactly 5 notable entries. Found: $COUNT"
            exit 1
          fi

          echo "✅ README What's New policy passed (5 entries)."

      - name: Pack
        run: dotnet pack src/ElBruno.S1Mini/ElBruno.S1Mini.csproj -c Release --no-build -p:Version=${{ steps.version.outputs.version }} -o artifacts

      - name: Validate package content
        shell: pwsh
        run: ./scripts/Validate-PackageContent.ps1 -PackageDirectory ./artifacts

      - name: Validate packed assembly versions
        shell: pwsh
        run: ./scripts/Validate-PackageAssemblyVersions.ps1 -PackageDirectory ./artifacts

      - name: NuGet login (OIDC → temp API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to NuGet.org
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $packages = @(Get-ChildItem -Path artifacts -Filter '*.nupkg' | Where-Object { $_.Name -notlike '*.symbols.nupkg' } | Sort-Object Name)
          if ($packages.Count -eq 0) {
            throw 'No .nupkg files found under artifacts.'
          }

          $symbolPackages = @(Get-ChildItem -Path artifacts -Filter '*.snupkg' | Sort-Object Name)
          $arguments = @('nuget', 'push') + @($packages.FullName) + @('--api-key', '${{ steps.login.outputs.NUGET_API_KEY }}', '--source', 'https://api.nuget.org/v3/index.json', '--skip-duplicate')
          $output = @(& dotnet @arguments 2>&1 | ForEach-Object { $_.ToString() })
          $exitCode = $LASTEXITCODE
          $pushLog = $output -join [Environment]::NewLine

          if ($pushLog) {
            Write-Host $pushLog
          }

          if ($exitCode -ne 0) {
            throw "NuGet push failed with exit code $exitCode. See output above."
          }

          $duplicateSkipPattern = '(?im)^\s*(warn\s*:\s*)?(Your (symbols? )?package was not pushed since it already exists in the destination\.?|Package .+ was not pushed because it already exists in the destination\.?)\s*$'
          if ($pushLog -match $duplicateSkipPattern) {
            throw "NuGet push skipped at least one package because version ${{ steps.version.outputs.version }} already exists on NuGet.org. A release-triggered publish that pushes nothing is treated as a failed release signal. If this is a job re-run after a later step failed, the package was already published; inspect the previous run instead of expecting this publish step to go green."
          }

          $expectedPushCount = $packages.Count + $symbolPackages.Count
          $pushConfirmationCount = ([regex]::Matches($pushLog, 'Your (symbols? )?package was pushed\.')).Count

          if ($pushConfirmationCount -lt $expectedPushCount) {
            throw "NuGet push completed, but only $pushConfirmationCount of $expectedPushCount expected push confirmation(s) were found. Expected 'Your package was pushed.' confirmation(s) in the output."
          }

          Write-Host "✅ Published ElBruno.S1Mini ${{ steps.version.outputs.version }} to NuGet.org ($pushConfirmationCount push confirmation(s): $($packages.Count) package, $($symbolPackages.Count) symbol)."

      - name: Upload NuGet package artifact
        uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: artifacts/*.nupkg
